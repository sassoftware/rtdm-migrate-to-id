---
annotations:
  du.sas.com/purpose: application
  du.sas.com/visibility: internal
application_data:
  facets:
    - provides:
        - name: "@FACETS_PROVIDES_NAME@"
          versions:
            - "@FACETS_PROVIDES_VERSIONS@"
      requires: []
  sadFormatVersion: 10.0.0
base_image: sas-ubi8-java17
contacts:
  - role: development_manager
    contact: {{{{ .data.DevManagerUserID }}}}
  - role: testing_manager
    contact: {{{{ .data.TestManagerUserID }}}}
  - role: support
    contact: {{{{ .data.SupportUserID }}}}
localize: true
microservice: true
security:
  webapp: false
api:
- endpoint: /{{{{ .data.ContextName }}}}
  supported_versions:
  - api_version: v1
    public: true
description: "{{{{ .data.Description }}}}"
du_name: {{{{ .data.DU }}}}
lang: en
license: SAS Institute Inc.
name: {{{{ .data.DU }}}}
package: du+docker
release_contexts:
  - viya_4.x
platform: lax
platform_id: x64-oci-linux-2
sources: []
services: []
summary: "{{{{ .data.Description }}}}"
