server.port=8080
spring.mustache.check-template-location=false
rtdm2id.consolidate-calculated-rulesets=true
#logging.level.org.springframework.web.client.RestTemplate=DEBUG
# Timeouts for REST calls to the target Viya environment (Spring Boot duration syntax, e.g. 30s, 10m).
# Reads are generous because some Viya calls (e.g. creating large Decisions) can be slow.
rtdm2id.http.connect-timeout=30s
rtdm2id.http.read-timeout=10m

# Browser origins allowed to call the API cross-origin, comma-separated (e.g. https://tools.example.com).
# Empty (default) means no cross-origin access.
rtdm2id.cors.allowed-origins=

# Debug aid: write the generated Decision JSON to a file before it is posted to Viya.
# Write failures are logged as warnings and never fail the migration.
rtdm2id.debug.write-decision-json=false
#rtdm2id.debug.decision-json-path=decision.json
