---
# Required substitution variables:
ContextName: "someContext" # Context root name of the service
DU: "sas-du-name" # Deployable Unit name (only prefix with sas if intending to ship to customers)
Description: "Provide a short description of the service"
ArtifactoryGroup: "com.sas.changeme" # Artifactory group
ArtifactoryTeam: "changeme-team" # Artifactory stack-team

DevManagerUserID: "userid" # SAS User ID for the Development Manager contact
TestManagerUserID: "userid" # SAS User ID for the Testing Manager contact
SupportUserID: "userid" # SAS User ID for a Development Support contact

MaintainerOrg: "name-of-organization" # Org of the GitHub Maintainer team for the repository
MaintainerTeam: "team-of-maintainers" # Name of the GitHub Maintainer team for the repository
